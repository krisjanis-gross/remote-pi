# Managed by remote-pi provision/install.sh
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    @EXTRA_LISTEN@
    server_name _;
    root @WEB_ROOT@;
    index index.html;

    server_tokens off;
    # The worker calls the sensor endpoint every second; access logs would only fill RAM.
    access_log off;
    error_log syslog:server=unix:/dev/log,tag=nginx warn;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API used by the app and Home Assistant
    location = /json_API_v2.php { include snippets/remote-pi-php.conf; }
    location = /json_ha.php     { include snippets/remote-pi-php.conf; }
    location = /csv_export.php  { include snippets/remote-pi-php.conf; }

    # Called by the background worker on this device only
    location = /read_sensor_data.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/remote-pi-php.conf;
    }
    location = /monitor_checkin.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/remote-pi-php.conf;
    }

    # Libraries, site scripts, databases and hidden files are never served.
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(db|sqlite|php_template)$ { return 404; }
    location ^~ /vendor/ { return 404; }
    location ^~ /sqlite_db_templates/ { return 404; }

    # Single-page app: routes like /home or /historic-data load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
