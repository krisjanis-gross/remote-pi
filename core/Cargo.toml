[package]
name = "remote-pi-core"
version = "0.1.0"
edition = "2021"
description = "Remote PI device core: owns the outputs and runs each site's Lua rules"
license = "MIT"
publish = false

[[bin]]
name = "remote-pi"
path = "src/main.rs"

[dependencies]
# Lua 5.4, compiled into the binary (no system Lua needed on the Pi).
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
# SQLite compiled in, for the settings database the PHP backend also uses.
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
