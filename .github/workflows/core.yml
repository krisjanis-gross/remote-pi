name: Core (Rust + Lua rules)
on:
  push:
    paths: ["core/**", "sites/*/rules/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "sites/*/rules/**", ".github/workflows/core.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Every site's rules load
        run: for site in ../sites/*/rules; do cargo run --locked --quiet -- check "$site"; done
