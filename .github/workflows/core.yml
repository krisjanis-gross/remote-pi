name: Core (Rust + Lua rules)
on:
  push:
    paths: ["core/**", "sites/*/rules/**", "api/**", "tests/test_api.py", "tests/test_contract.py", "tests/test_timezone.py", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "sites/*/rules/**", "api/**", "tests/test_api.py", "tests/test_contract.py", "tests/test_timezone.py", ".github/workflows/core.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Every site's rules load
        run: for site in ../sites/*/rules; do cargo run --locked --quiet -- check "$site"; done
      - name: The app's API contract, as the PHP backend is tested
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-jsonschema
          cargo build --locked --release
          cd ../tests && REMOTE_PI_CORE="$PWD/../core/target/release/remote-pi" python3 -m unittest -v test_api test_contract test_timezone
